name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build on Linux
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        compiler:
          - { cc: gcc-11, cxx: g++-11 }
          - { cc: gcc-12, cxx: g++-12 }
          - { cc: gcc-13, cxx: g++-13 }
          - { cc: clang-13, cxx: clang++-13 }
          - { cc: clang-14, cxx: clang++-14 }
          - { cc: clang-15, cxx: clang++-15 }
        exclude:
          # Ubuntu 24.04 doesn't have older versions
          - os: ubuntu-24.04
            compiler: { cc: gcc-11, cxx: g++-11 }
          - os: ubuntu-24.04
            compiler: { cc: clang-13, cxx: clang++-13 }

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build qt5-qmake qtbase5-dev

    - name: Install compiler
      run: |
        if [[ "${{ matrix.compiler.cc }}" == gcc* ]]; then
          sudo apt-get install -y ${{ matrix.compiler.cc }} ${{ matrix.compiler.cxx }}
        elif [[ "${{ matrix.compiler.cc }}" == clang* ]]; then
          sudo apt-get install -y ${{ matrix.compiler.cc }} ${{ matrix.compiler.cxx }}
        fi

    - name: Configure CMake
      env:
        CC: ${{ matrix.compiler.cc }}
        CXX: ${{ matrix.compiler.cxx }}
      run: |
        cmake -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_STANDARD=20 \
          -DCMAKE_CXX_STANDARD_REQUIRED=ON

    - name: Build
      run: cmake --build build --config Release

    - name: List build artifacts
      run: |
        echo "=== Build artifacts ==="
        find build -type f -name "example-*" -executable
        ls -lh build/Release/bin/Release/ || ls -lh build/bin/ || true

    - name: Test basic functionality (compile check)
      run: |
        echo "Build completed successfully on ${{ matrix.os }} with ${{ matrix.compiler.cxx }}"

  build-windows:
    name: Build on Windows
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2019]
        arch: [x64]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch }}

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        cache: true

    - name: Configure CMake
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A ${{ matrix.arch }} `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_CXX_STANDARD=20 `
          -DCMAKE_CXX_STANDARD_REQUIRED=ON

    - name: Build
      run: cmake --build build --config Release

    - name: List build artifacts
      shell: pwsh
      run: |
        Write-Host "=== Build artifacts ==="
        Get-ChildItem -Recurse build -Filter "example-*.exe" | ForEach-Object { $_.FullName }
        if (Test-Path "build\Release\bin\Release") {
          Get-ChildItem -Path "build\Release\bin\Release" -Filter "*.exe" |
            ForEach-Object {
              Write-Host "$($_.Name) - $([math]::Round($_.Length/1KB, 2)) KB"
            }
        }

    - name: Test basic functionality (compile check)
      run: |
        echo "Build completed successfully on ${{ matrix.os }} with MSVC"

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    if: always()
    steps:
    - name: Summary
      run: |
        echo "### Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Linux builds: ${{ needs.build-linux.result }}" >> $GITHUB_STEP_SUMMARY
        echo "✅ Windows builds: ${{ needs.build-windows.result }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Platform Coverage:**" >> $GITHUB_STEP_SUMMARY
        echo "- Ubuntu 22.04, 24.04" >> $GITHUB_STEP_SUMMARY
        echo "- Windows Server 2019, 2022" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Compiler Coverage:**" >> $GITHUB_STEP_SUMMARY
        echo "- GCC 11, 12, 13" >> $GITHUB_STEP_SUMMARY
        echo "- Clang 13, 14, 15" >> $GITHUB_STEP_SUMMARY
        echo "- MSVC 2019, 2022" >> $GITHUB_STEP_SUMMARY
